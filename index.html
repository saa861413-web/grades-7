<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - نظام النتائج</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-dark: #121417;
            --primary: #d4af37;
        }
        body {
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.6s ease;
            overflow-x: hidden;
            color: #fff;
        }

        /* الحالة الافتراضية - إضاءة بيضاء */
        body.white-state {
            background-color: #1c1f24;
        }
        body.white-state .lamp-shade {
            background: #fff9e6;
            box-shadow: 0 -5px 25px rgba(255, 249, 230, 0.6);
        }
        body.white-state .light-beam {
            opacity: 1;
            background: linear-gradient(to bottom, rgba(255, 249, 230, 0.4) 0%, transparent 100%);
        }
        body.white-state .click-text {
            color: #f6d365;
            text-shadow: 0 0 15px rgba(246, 211, 101, 0.6);
        }

        /* حالة النجاح - أخضر */
        body.success-state {
            background-color: #152219;
        }
        body.success-state .lamp-shade {
            background: #eafaf1;
            box-shadow: 0 -5px 25px rgba(46, 204, 113, 0.7);
        }
        body.success-state .light-beam {
            opacity: 1;
            background: linear-gradient(to bottom, rgba(46, 204, 113, 0.45) 0%, transparent 100%);
        }
        body.success-state .click-text {
            color: #2ecc71;
            text-shadow: 0 0 15px rgba(46, 204, 113, 0.6);
        }

        /* حالة الرسوب - أحمر */
        body.fail-state {
            background-color: #261414;
        }
        body.fail-state .lamp-shade {
            background: #fdedec;
            box-shadow: 0 -5px 25px rgba(231, 76, 60, 0.7);
        }
        body.fail-state .light-beam {
            opacity: 1;
            background: linear-gradient(to bottom, rgba(231, 76, 60, 0.45) 0%, transparent 100%);
        }
        body.fail-state .click-text {
            color: #e74c3c;
            text-shadow: 0 0 15px rgba(231, 76, 60, 0.6);
        }
        
        .wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            z-index: 1;
            width: 90%;
            max-width: 900px;
        }

        /* ----- قسم الأباجورة ----- */
        .lamp-section {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            user-select: none;
            padding-top: 20px;
        }
        .click-text {
            font-size: 22px;
            color: #555;
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
            transition: color 0.4s, text-shadow 0.4s;
        }
        .lamp {
            position: relative;
            width: 140px;
            height: 280px;
        }
        .lamp-shade {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 70px;
            background: #e0e0e0;
            border-radius: 70px 70px 0 0;
            z-index: 2;
            transition: background 0.4s, box-shadow 0.4s;
        }
        .lamp-stand {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 200px;
            background: #666;
            border-radius: 7px;
        }
        .lamp-base {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 90px;
            height: 15px;
            background: #555;
            border-radius: 10px 10px 0 0;
        }
        .pull-string {
            position: absolute;
            top: 90px;
            left: 75%;
            width: 2px;
            height: 60px;
            background: #999;
            transform-origin: top;
            transition: height 0.2s;
            z-index: 3;
        }
        .pull-string::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: -4px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
        }
        .lamp-section:active .pull-string {
            height: 85px;
        }
        .light-beam {
            position: absolute;
            top: 90px;
            left: -55px;
            width: 250px;
            height: 350px;
            background: transparent;
            clip-path: polygon(28% 0, 72% 0, 100% 100%, 0 100%);
            opacity: 0;
            transition: opacity 0.6s ease, background 0.6s ease;
            z-index: 1;
            pointer-events: none;
        }

        /* ----- قسم الفورم ----- */
        .form-section {
            flex: 1;
            max-width: 480px;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
        .glass-card h2 {
            margin-top: 0;
            margin-bottom: 25px;
            font-weight: 500;
            font-size: 26px;
            color: #fff;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            color: #aaa;
        }
        .input-group input {
            width: 100%;
            padding: 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 3px;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
            box-sizing: border-box;
        }
        .input-group input:focus {
            border-color: var(--primary);
        }
        button.submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #d4af37, #f6d365);
            border: none;
            border-radius: 10px;
            color: #121417;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        /* ----- قسم النتائج ----- */
        .result-container {
            margin-top: 25px;
            text-align: right;
            background: rgba(0, 0, 0, 0.4);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
        }
        .result-row:last-child { border-bottom: none; }
        .label { color: #aaa; font-size: 15px;}
        .value { color: #fff; font-weight: bold; font-size: 15px;}
        .status-pass { color: #2ecc71; text-shadow: 0 0 8px rgba(46, 204, 113, 0.4);}
        .status-fail { color: #e74c3c; text-shadow: 0 0 8px rgba(231, 76, 60, 0.4);}
        .error-msg {
            margin-top: 20px;
            color: #ff7675;
            background: rgba(255, 118, 117, 0.1);
            padding: 15px;
            border-radius: 10px;
            font-size: 15px;
        }

        @media (max-width: 768px) {
            .wrapper { flex-direction: column; gap: 40px; padding: 20px; }
            .lamp-section { transform: scale(0.85); padding-top: 0; }
            .form-section { max-width: 100%; }
        }
    </style>
</head>
<body id="body" class="white-state">
    
    <div class="wrapper">
        <div class="lamp-section" onclick="toggleManualLight()">
            <div class="click-text" id="clickText">اضغط</div>
            <div class="lamp">
                <div class="lamp-shade"></div>
                <div class="light-beam"></div>
                <div class="pull-string"></div>
                <div class="lamp-stand"></div>
                <div class="lamp-base"></div>
            </div>
        </div>
        
        <div class="form-section">
            <div class="glass-card">
                <h2>Welcome</h2>
                <form id="resultForm" onsubmit="searchStudent(event)">
                    <div class="input-group">
                        <label>كود الطالب السري</label>
                        <input type="text" id="codeInput" placeholder="أدخل الكود" maxlength="10" required autocomplete="off">
                    </div>
                    <button type="submit" class="submit-btn">Sign In</button>
                </form>
                
                <div id="resultArea"></div>
            </div>
        </div>
    </div>

    <script>
        let studentsData = [];

        // قائمة بجميع ملفات الإكسيل المرفوعة
        const excelFiles = ['درجات_الطلاب_مع_الأكواد.xlsx', 'تمهيدي.xlsx'];

        // دالة مساعدة للبحث الذكي عن القيم في الصفوف
        function getRowValue(row, ...keywords) {
            const keys = Object.keys(row);
            for (let kw of keywords) {
                const foundKey = keys.find(k => k.trim().replace(/آ|أ|إ/g, 'ا').includes(kw.replace(/آ|أ|إ/g, 'ا')));
                if (foundKey !== undefined && row[foundKey] !== undefined && row[foundKey] !== '') {
                    return String(row[foundKey]).trim();
                }
            }
            return '';
        }

        // تنسيق النسب المئوية
        function formatPercent(val) {
            if (!val && val !== 0) return '0%';
            let strVal = String(val).replace(',', '.').trim();
            if (strVal.includes('%')) return strVal;
            let num = parseFloat(strVal);
            if (isNaN(num)) return strVal;
            if (num <= 1 && num > 0) num = num * 100;
            return Math.round(num) + '%';
        }

        // تنسيق عرض الدرجة لتجاوز كلمة "لم تدخل"
        function formatScoreDisplay(score, total) {
            if (!score && score !== '0') return 'غير محدد';
            let strScore = String(score).trim();
            if (strScore.includes('لم') || strScore.includes('غائب') || isNaN(Number(strScore.replace(',', '.')))) {
                return strScore;
            }
            return total ? `${strScore} / ${total}` : strScore;
        }

        // دالة تحميل وقراءة كلاً من ملفات الإكسيل
        async function loadExcelData() {
            try {
                let allJsonRows = [];

                for (let fileName of excelFiles) {
                    try {
                        let response = await fetch(encodeURI(fileName));
                        if (!response.ok) continue;
                        let data = await response.arrayBuffer();
                        let workbook = XLSX.read(data, {type: 'array'});
                        let firstSheet = workbook.SheetNames[0];
                        let jsonSheet = XLSX.utils.sheet_to_json(workbook.Sheets[firstSheet]);
                        allJsonRows = allJsonRows.concat(jsonSheet);
                    } catch (fileErr) {
                        console.error(`خطأ أثناء قراءة الملف ${fileName}:`, fileErr);
                    }
                }

                // استخراج وعصر البيانات الذكي
                studentsData = allJsonRows.map(row => {
                    // تنظيف المفاتيح داخل الصف
                    let cleanRow = {};
                    for (let k in row) {
                        cleanRow[k.trim()] = row[k];
                    }

                    let rawCode = getRowValue(cleanRow, 'الكود المشفر', 'كود', 'code');
                    let studentName = getRowValue(cleanRow, 'الطالب', 'الاسم', 'اسم');
                    let gradeYear = getRowValue(cleanRow, 'السنة', 'الصف');
                    
                    let quranScore = getRowValue(cleanRow, 'درجة القرآن', 'درجة القران');
                    let quranTotal = getRowValue(cleanRow, 'مجموع القرآن', 'مجموع القران');
                    let quranPercent = formatPercent(getRowValue(cleanRow, 'نسبة القرآن', 'نسبة القران'));

                    let arabicScore = getRowValue(cleanRow, 'درجة العربي');
                    let arabicTotal = getRowValue(cleanRow, 'مجموع العربي');
                    let arabicPercent = formatPercent(getRowValue(cleanRow, 'نسبة العربي'));

                    let statusVal = getRowValue(cleanRow, 'التقدير', 'الحالة');

                    let hasArabic = Boolean(arabicScore || arabicTotal || getRowValue(cleanRow, 'نسبة العربي'));

                    return {
                        code: rawCode.toUpperCase().replace(/\s+/g, ''),
                        name: studentName || 'غير محدد',
                        grade: gradeYear || 'غير محدد',
                        isNewFormat: hasArabic,
                        
                        quranScore: quranScore || '0',
                        quranTotal: quranTotal || '0',
                        quranPercent: quranPercent,
                        
                        arabicScore: arabicScore || '0',
                        arabicTotal: arabicTotal || '0',
                        arabicPercent: arabicPercent,
                        
                        status: statusVal
                    };
                });
                
                console.log("تم تحميل عدد طلاب:", studentsData.length);
            } catch (err) {
                console.error("خطأ عام أثناء تحميل البيانات:", err);
            }
        }

        loadExcelData();

        const codeInput = document.getElementById('codeInput');
        const bodyEl = document.getElementById('body');

        codeInput.addEventListener('input', function() {
            if (this.value.trim() === '') {
                bodyEl.classList.remove('success-state', 'fail-state');
                bodyEl.classList.add('white-state');
                document.getElementById('resultArea').innerHTML = '';
            }
        });

        function toggleManualLight() {
            if (codeInput.value.trim() === '') {
                bodyEl.classList.toggle('white-state');
            }
        }

        function searchStudent(event) {
            event.preventDefault();
            const inputCode = codeInput.value.trim().toUpperCase().replace(/\s+/g, '');
            const resultArea = document.getElementById('resultArea');
            
            bodyEl.classList.remove('success-state', 'fail-state', 'white-state');

            if (studentsData.length === 0) {
                resultArea.innerHTML = `<div class="error-msg">جاري تحميل البيانات... حاول مرة أخرى خلال ثوانٍ.</div>`;
                bodyEl.classList.add('white-state');
                return;
            }

            const student = studentsData.find(s => s.code === inputCode);

            if (student) {
                const statusText = student.status.toLowerCase();
                const scoresCombined = `${student.quranScore} ${student.arabicScore}`.toLowerCase();
                
                const isAbsent = statusText.includes('غائب') || statusText.includes('لم يحضر') || scoresCombined.includes('لم تدخل');
                const isFail = statusText.includes('راسب') || statusText.includes('ضعيف');
                const isPass = !isFail && !isAbsent;

                if (isAbsent) {
                    bodyEl.classList.remove('success-state', 'fail-state', 'white-state');
                } else if (isFail) {
                    bodyEl.classList.add('fail-state');
                } else if (isPass) {
                    bodyEl.classList.add('success-state');
                    triggerFireworks();
                }

                const statusClass = isPass ? 'status-pass' : 'status-fail';
                
                if (student.isNewFormat) {
                    // عرض بيانات ملف التمهيدي (قرآن + عربي)
                    resultArea.innerHTML = `
                        <div class="result-container">
                            <div class="result-row"><span class="label">اسم الطالب:</span> <span class="value">${student.name}</span></div>
                            <div class="result-row"><span class="label">السنة:</span> <span class="value">${student.grade}</span></div>
                            <div class="result-row"><span class="label">درجة القرآن:</span> <span class="value">${formatScoreDisplay(student.quranScore, student.quranTotal)}</span></div>
                            <div class="result-row"><span class="label">نسبة القرآن:</span> <span class="value">${student.quranPercent}</span></div>
                            <div class="result-row"><span class="label">درجة العربي:</span> <span class="value">${formatScoreDisplay(student.arabicScore, student.arabicTotal)}</span></div>
                            <div class="result-row"><span class="label">نسبة العربي:</span> <span class="value">${student.arabicPercent}</span></div>
                            ${student.status ? `<div class="result-row"><span class="label">التقدير العام:</span> <span class="value ${statusClass}">${student.status}</span></div>` : ''}
                        </div>
                    `;
                } else {
                    // عرض بيانات الملف القديم (قرآن فقط)
                    resultArea.innerHTML = `
                        <div class="result-container">
                            <div class="result-row"><span class="label">اسم الطالب:</span> <span class="value">${student.name}</span></div>
                            <div class="result-row"><span class="label">الصف:</span> <span class="value">${student.grade}</span></div>
                            <div class="result-row"><span class="label">درجة القرآن:</span> <span class="value">${formatScoreDisplay(student.quranScore, student.quranTotal)}</span></div>
                            <div class="result-row"><span class="label">النسبة المئوية:</span> <span class="value">${student.quranPercent}</span></div>
                            ${student.status ? `<div class="result-row"><span class="label">التقدير:</span> <span class="value ${statusClass}">${student.status}</span></div>` : ''}
                        </div>
                    `;
                }

            } else {
                bodyEl.classList.remove('success-state', 'fail-state', 'white-state');
                resultArea.innerHTML = `<div class="error-msg">عذراً، الكود الذي أدخلته غير صحيح أو غير موجود!</div>`;
            }
        }

        // الاحتفال بالـ Confetti عند النجاح
        function triggerFireworks() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 999 };

            function randomInRange(min, max) {
                return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }
    </script>
</body>
</html>
